name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build client
        run: go build -v ./cmd/namd

      - name: Build server
        run: go build -v ./cmd/namd-server

      - name: Build all packages
        run: go build -v ./...

      - name: Run tests
        run: go test -race -timeout 30s ./...

      - name: Vet
        run: go vet ./...

  cross-compile:
    name: Cross-compile binaries
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: namd-linux-amd64
          - goos: linux
            goarch: arm64
            name: namd-linux-arm64
          - goos: darwin
            goarch: amd64
            name: namd-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: namd-darwin-arm64
          - goos: windows
            goarch: amd64
            name: namd-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build ${{ matrix.name }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-X github.com/gabbykarry/namd/pkg/version.Version=${{ github.sha }}" \
            -o bin/${{ matrix.name }} \
            ./cmd/namd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: bin/${{ matrix.name }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: cross-compile
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.sha }}
          name: Release ${{ github.sha }}
          files: bin/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}