name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go mod download
      - run: go build -v ./cmd/namd
      - run: go build -v ./cmd/namd-server
      - run: go build -v ./...
      - run: go test -race -timeout 30s ./...
      - run: go vet ./...

  release:
    name: Release binaries
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build all binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}

          GOOS=darwin  GOARCH=arm64 go build -ldflags "-X github.com/gabbykarry/namd/pkg/version.Version=${VERSION}" -o dist/namd-darwin-arm64  ./cmd/namd
          GOOS=darwin  GOARCH=amd64 go build -ldflags "-X github.com/gabbykarry/namd/pkg/version.Version=${VERSION}" -o dist/namd-darwin-amd64  ./cmd/namd
          GOOS=linux   GOARCH=amd64 go build -ldflags "-X github.com/gabbykarry/namd/pkg/version.Version=${VERSION}" -o dist/namd-linux-amd64   ./cmd/namd
          GOOS=linux   GOARCH=arm64 go build -ldflags "-X github.com/gabbykarry/namd/pkg/version.Version=${VERSION}" -o dist/namd-linux-arm64   ./cmd/namd
          GOOS=windows GOARCH=amd64 go build -ldflags "-X github.com/gabbykarry/namd/pkg/version.Version=${VERSION}" -o dist/namd-windows-amd64.exe ./cmd/namd

          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: namd ${{ github.ref_name }}
          body: |
            ## Install namd ${{ github.ref_name }}

            Pick the right binary for your machine:

            | Your machine | Download |
            |---|---|
            | MacBook M1/M2/M3/M4 (2020 or newer) | `namd-darwin-arm64` |
            | MacBook Intel (2019 or older) | `namd-darwin-amd64` |
            | Linux / Ubuntu / VPS | `namd-linux-amd64` |
            | Linux ARM (Raspberry Pi etc) | `namd-linux-arm64` |
            | Windows | `namd-windows-amd64.exe` |

            **Not sure which Mac?** Apple menu → About This Mac → look for "Apple M1/M2/M3" or "Intel".

            ### macOS / Linux — quick install
            ```bash
            # macOS Apple Silicon (M1/M2/M3/M4)
            curl -L https://github.com/gabbykarry/namd/releases/download/${{ github.ref_name }}/namd-darwin-arm64 -o namd
            chmod +x namd && sudo mv namd /usr/local/bin/

            # Linux
            curl -L https://github.com/gabbykarry/namd/releases/download/${{ github.ref_name }}/namd-linux-amd64 -o namd
            chmod +x namd && sudo mv namd /usr/local/bin/
            ```

            ### Windows
            1. Download `namd-windows-amd64.exe` below
            2. Rename it to `namd.exe`
            3. Move it to `C:\Windows\System32\` (or any folder in your PATH)
            4. Open Command Prompt and run `namd version`

            ### After installing
            ```bash
            namd auth register --name yourname --email you@example.com
            namd start
            ```
          files: dist/*
          generate_release_notes: false